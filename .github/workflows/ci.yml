name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write     # REQUIRED for OIDC
  contents: read

jobs:
  # ---- JOB 1: test against mocked AWS (no credentials needed) ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -v

  # ---- JOB 2: deploy the real infrastructure ----
  deploy:
    needs: test                              # only if tests passed
    if: github.ref == 'refs/heads/main'      
    # only on main, not PRs
    runs-on: ubuntu-latest
    permissions:                             # explicit at job level
      id-token: write                        # REQUIRED for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC identity
        run: |
          echo "repository : ${{ github.repository }}"
          echo "ref        : ${{ github.ref }}"
          echo "expected   : repo:${{ github.repository }}:ref:${{ github.ref }}"

      - name: Get short-lived AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="github_repo=${{ github.repository }}"